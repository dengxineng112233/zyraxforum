<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>登录 - CloudForum</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <script defer src="/assets/app.js"></script>
  
</head>
<body data-page="login">
  <header class="topbar"><div class="container nav"><a class="brand" href="/"><span class="logo">CF</span><span>CloudForum</span></a><div class="nav-actions"><span id="currentUserLabel" class="pill" style="display:none"></span><a class="pill" href="/">论坛首页</a><a id="registerLink" class="pill primary" href="/register/">注册</a><button id="logoutBtn" class="pill" type="button" style="display:none">退出登录</button></div></div></header>
  <main class="auth-wrap"><section class="panel auth-card"><h1>登录</h1><p class="lead">进入账号后可以发帖、点赞和评论。</p><form class="form" id="loginForm"><div class="field"><label for="username">用户名或邮箱</label><input class="input" id="username" autocomplete="username" required /></div><div class="field"><label for="password">密码</label><input class="input" id="password" type="password" autocomplete="current-password" minlength="8" required /></div><button class="pill primary" type="submit">登录账号</button><div class="message" id="authMsg"></div><div class="hint">没有账号？<a href="/register/">去注册</a> · 忘记密码？<a href="/forgot/">找回密码</a></div></form></section></main>
</body>
</html>
