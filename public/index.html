<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CloudForum - 首页</title>
  <meta name="description" content="Cloudflare Pages forum with topic routes." />
  <link rel="stylesheet" href="/assets/style.css" />
  <script defer src="/assets/app.js"></script>
</head>
<body data-page="forum">
  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="/"><span class="logo">CF</span><span>CloudForum</span></a>
      <div class="nav-actions">
        <span id="currentUserLabel" class="pill" style="display:none"></span>
        <a id="loginLink" class="pill" href="/login/">登录</a>
        <a id="registerLink" class="pill primary" href="/register/">注册</a>
        <button id="seedBtn" class="pill" type="button">初始化示例</button>
        <button id="logoutBtn" class="pill" type="button" style="display:none">退出登录</button>
        <a id="composeLink" class="pill primary" href="#composer" style="display:none">发帖</a>
      </div>
    </div>
  </header>
  <section class="page-head">
    <div class="container forum-title">
      <div>
        <h1>CloudForum</h1>
        <p class="lead">干净的主题列表、独立帖子链接、登录注册分离：<span class="kbd">/login/</span>、<span class="kbd">/register/</span>、<span class="kbd">/t/slug/id/</span>。</p>
      </div>
      <div class="stats">
        <div class="stat"><b id="statUsers">0</b><span>用户</span></div>
        <div class="stat"><b id="statPosts">0</b><span>主题</span></div>
        <div class="stat"><b id="statComments">0</b><span>回复</span></div>
      </div>
    </div>
  </section>
  <main class="main">
    <div class="container layout">
      <aside class="panel sidebar"><h2 class="section-title">分类</h2><div class="category-list" id="categoryList"></div></aside>
      <section class="content-stack" id="forumRoot"></section>
    </div>
  </main>
  <footer class="footer"><div class="container">Cloudflare Pages 静态路由：根目录 <span class="kbd">index.html</span>，主题详情由 <span class="kbd">/t/slug/id/</span> 前端路由渲染。</div></footer>
</body>
</html>
