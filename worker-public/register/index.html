<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>&#x6ce8;&#x518c; - ZyraxForum</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <script defer src="/assets/app.js"></script>
  <link rel="icon" href="/assets/logo.png" type="image/png" />
</head>
<body data-page="register">
  <header class="topbar"><div class="container nav"><a class="brand" href="/"><span class="logo"><img src="/assets/logo.png" alt="ZyraxForum"></span><span>ZyraxForum</span></a><div class="nav-actions"><span id="currentUserLabel" class="pill" style="display:none"></span><a class="pill" href="/">&#x8bba;&#x575b;&#x9996;&#x9875;</a><a id="loginLink" class="pill" href="/login/">&#x767b;&#x5f55;</a><button id="logoutBtn" class="pill" type="button" style="display:none">&#x9000;&#x51fa;&#x767b;&#x5f55;</button></div></div></header>
  <main class="auth-wrap">
    <section class="panel auth-card">
      <h1>&#x6ce8;&#x518c;</h1>
      <p class="lead">&#x5148;&#x9a8c;&#x8bc1;&#x90ae;&#x7bb1;&#xff0c;&#x518d;&#x521b;&#x5efa;&#x4e91;&#x7aef;&#x8d26;&#x53f7;&#x3002;</p>
      <form class="form" id="registerForm">
        <div class="field"><label for="username">&#x7528;&#x6237;&#x540d;</label><input class="input" id="username" autocomplete="username" maxlength="24" placeholder="&#x4e2d;&#x6587;&#x3001;&#x5b57;&#x6bcd;&#x3001;&#x6570;&#x5b57;&#x3001;_&#x3001;-" required /></div>
        <div class="field"><label for="email">&#x90ae;&#x7bb1;</label><input class="input" id="email" type="email" autocomplete="email" required /></div>
        <div class="field"><label for="verificationCode">&#x90ae;&#x7bb1;&#x9a8c;&#x8bc1;&#x7801;</label><div style="display:flex;gap:10px"><input class="input" id="verificationCode" inputmode="numeric" maxlength="6" placeholder="6 &#x4f4d;&#x9a8c;&#x8bc1;&#x7801;" required /><button class="pill" id="sendCodeBtn" type="button" style="white-space:nowrap">&#x53d1;&#x9001;&#x9a8c;&#x8bc1;&#x7801;</button></div></div>
        <div class="field"><label for="password">&#x5bc6;&#x7801;</label><input class="input" id="password" type="password" autocomplete="new-password" minlength="8" required /></div>
        <div class="field"><label for="confirmPassword">&#x786e;&#x8ba4;&#x5bc6;&#x7801;</label><input class="input" id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required /></div>
        <button class="pill primary" type="submit">&#x6ce8;&#x518c;&#x8d26;&#x53f7;</button>
        <div class="message" id="authMsg"></div>
        <div class="hint">&#x5df2;&#x6709;&#x8d26;&#x53f7;&#xff1f;<a href="/login/">&#x53bb;&#x767b;&#x5f55;</a></div>
      </form>
    </section>
  </main>
</body>
</html>
